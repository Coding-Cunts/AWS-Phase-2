version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm use 22 || true
        - npm --prefix frontend install --legacy-peer-deps
    build:
      commands:
        - npm --prefix frontend run build
        - node scripts/prepare-amplify-artifacts.mjs
  artifacts:
    baseDirectory: frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - frontend/.next/cache/**/*
      - frontend/node_modules/**/*
