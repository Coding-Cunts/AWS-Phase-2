      // --- AUDIO SYNTHESIZER ---
      class SoundEffects {
        constructor() { this.ctx = null; }
        init() {
          if (!this.ctx && typeof window !== 'undefined') {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
        }
        playShutter() {
          this.init();
          if (!this.ctx) return;
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.08);
            if (navigator.vibrate) navigator.vibrate(15);
          } catch (e) {}
        }
        playSuccess() {
          this.init();
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            [523.25, 659.25, 783.99].forEach((freq, i) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + i * 0.06);
              gain.gain.setValueAtTime(0.15, now + i * 0.06);
              gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.25);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + i * 0.06);
              osc.stop(now + i * 0.06 + 0.25);
            });
            if (navigator.vibrate) navigator.vibrate([20, 30, 40]);
          } catch (e) {}
        }
        playWarning() {
          this.init();
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.setValueAtTime(180, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
          } catch (e) {}
        }
      }

      // --- TELEMETRY STORE ---
      class TelemetryStore {
        constructor() {
          this.events = [];
          this.sessionToken = 'sess_' + Math.random().toString(36).substring(2, 12);
          this.networkTier = '4g';
        }
        logScanEvent(scanData) {
          const scanEvent = {
            scan_id: 'scan_' + Math.random().toString(36).substring(2, 10),
            session_token: this.sessionToken,
            created_at: new Date().toISOString(),
            client_network_tier: this.networkTier,
            primary_bin: scanData.primary_bin || 'NON_RECYCLABLE',
            material_subtype: scanData.material_subtype || 'UNKNOWN',
            confidence_score: parseFloat((scanData.confidence_score || 0.85).toFixed(3)),
            prep_instructions: scanData.prep_instructions || [],
            is_composite: !!scanData.is_composite,
            inference_latency_ms: scanData.inference_latency_ms || Math.floor(Math.random() * 400 + 420),
            user_flagged_error: false,
            user_suggested_bin: null,
            raw_item_name: scanData.name || 'Scanned Waste Item'
          };
          this.events.unshift(scanEvent);
          return scanEvent;
        }
        flagDispute(scanId, suggestedBin) {
          const event = this.events.find(e => e.scan_id === scanId);
          if (event) {
            event.user_flagged_error = true;
            event.user_suggested_bin = suggestedBin;
          }
        }
        getMetrics() {
          const totalScans = this.events.length;
          if (totalScans === 0) {
            return { totalScans: 0, avgLatencyMs: 540, p95LatencyMs: 1120, scrRate: 94.2, disputeRate: 1.8, events: [] };
          }
          const latencies = this.events.map(e => e.inference_latency_ms).sort((a, b) => a - b);
          const avgLatency = Math.round(latencies.reduce((a, b) => a + b, 0) / totalScans);
          const disputes = this.events.filter(e => e.user_flagged_error).length;
          const disputeRate = parseFloat(((disputes / totalScans) * 100).toFixed(1));
          return {
            totalScans,
            avgLatencyMs: avgLatency,
            p95LatencyMs: latencies[latencies.length - 1] || 980,
            scrRate: 94.2,
            disputeRate,
            events: this.events
          };
        }
      }
      const telemetryStore = new TelemetryStore();

      // --- VISION CLASSIFIER SERVICE ---
      class VisionClassifier {
        static analyzeLuminance(canvas) {
          const ctx = canvas.getContext('2d');
          if (!ctx) return 128;
          const sampleWidth = Math.min(100, canvas.width);
          const sampleHeight = Math.min(100, canvas.height);
          const imageData = ctx.getImageData(0, 0, sampleWidth, sampleHeight);
          const data = imageData.data;
          let total = 0;
          for (let i = 0; i < data.length; i += 4) {
            total += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          }
          return Math.round(total / (data.length / 4));
        }

        static async classifyImage({ canvas, overrideItem, networkTier }) {
          const startTime = performance.now();
          const luminance = this.analyzeLuminance(canvas);

          if (luminance < 30) {
            return {
              success: false,
              tooDark: true,
              luminance,
              message: 'Environment too dark (< 30/255). Turn on lights or flash.'
            };
          }

          let delay = 450;
          if (networkTier === '5g') delay = 220;
          if (networkTier === 'wifi') delay = 180;
          await new Promise(res => setTimeout(res, delay + Math.random() * 200));

          const totalMs = Math.round(performance.now() - startTime);
          let item = overrideItem;
          if (!item) {
            item = SAMPLE_ITEMS[Math.floor(Math.random() * SAMPLE_ITEMS.length)];
          }

          return {
            success: true,
            tooDark: false,
            luminance,
            inference_latency_ms: totalMs,
            result: { ...item }
          };
        }
      }

            }

              }

                  facingMode: { ideal: cameraFacing },
                  width: { ideal: 1280 },
                  height: { ideal: 720 }
                },
                audio: false
              };

              const mediaStream = await navigator.mediaDevices.getUserMedia(constraints);

              if (isMounted) {
                setStream(mediaStream);

                  videoRef.current.srcObject = mediaStream;

        const metrics = telemetryStore.getMetrics();
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
            <div className="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 max-h-[85vh] overflow-y-auto">
              <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 className="font-bold text-white text-base">PRD Data Model & Telemetry Inspector</h3>
                <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-white">
                  <Icons.Close className="w-5 h-5" />
                </button>
              </div>

              <div className="grid grid-cols-3 gap-2 text-center text-xs">
                <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                  <div className="text-slate-400">Scan SCR</div>
                  <div className="text-lg font-bold text-emerald-400">{metrics.scrRate}%</div>
                </div>
                <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                  <div className="text-slate-400">p95 Latency</div>
                  <div className="text-lg font-bold text-emerald-400">{metrics.p95LatencyMs}ms</div>
                </div>
                <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                  <div className="text-slate-400">Dispute Rate</div>
                  <div className="text-lg font-bold text-emerald-400">{metrics.disputeRate}%</div>
                </div>
              </div>

              <div className="space-y-1">
                <span className="text-xs font-mono text-emerald-400 font-bold">PostgreSQL ScanEvent Log</span>
                <div className="max-h-48 overflow-y-auto border border-slate-800 rounded-xl bg-slate-950 p-2 text-[11px] font-mono">
                  {metrics.events.length > 0 ? (
                    metrics.events.map(e => (
                      <div key={e.scan_id} className="py-1 border-b border-slate-900 flex justify-between">
                        <span>{e.raw_item_name}</span>
                        <span className="text-emerald-400">{e.inference_latency_ms}ms</span>
                        <span className="text-blue-300">{e.primary_bin}</span>
                      </div>
                    ))
                  ) : (
                    <div className="text-slate-500 italic p-2">No scan events recorded yet.</div>
                  )}
                </div>
              </div>
              <button onClick={onClose} className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs transition-colors cursor-pointer">
                Close
              </button>
            </div>
          </div>
        );
      }

      // --- SAMPLE GALLERY DIALOG ---
      function SampleGalleryDialog({ onClose, onSelect }) {
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
            <div className="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 max-h-[85vh] overflow-y-auto">
              <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 className="font-bold text-white text-base">Edge Case Waste Sample Library</h3>
                <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-white">
                  <Icons.Close className="w-5 h-5" />
                </button>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                {SAMPLE_ITEMS.map(item => (
                  <button
                    key={item.id}
                    onClick={() => { onSelect(item); onClose(); }}
                    className="p-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-2xl text-left flex items-start gap-3 cursor-pointer transition-colors"
                  >
                    <div className="w-12 h-12 bg-slate-900 rounded-xl p-1 shrink-0 flex items-center justify-center" dangerouslySetInnerHTML={{ __html: item.imageSvg }} />
                    <div>
                      <h4 className="font-bold text-xs text-white">{item.name}</h4>
                      <p className="text-[10px] text-emerald-400 font-mono font-bold mt-0.5">{item.primary_bin}</p>
                    </div>
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      }

      // --- DISPUTE DIALOG ---
      function DisputeDialog({ scanResult, onClose, onSubmit }) {
        const [selectedBin, setSelectedBin] = useState('RECYCLABLE');
        const [submitted, setSubmitted] = useState(false);

        const handleSub = (e) => {
          e.preventDefault();
          onSubmit(scanResult.scan_id || scanResult.result?.id, selectedBin);
          setSubmitted(true);
          setTimeout(() => { setSubmitted(false); onClose(); }, 1200);
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
              <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 className="font-bold text-white text-base">Flag Prediction Dispute</h3>
                <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-white">
                  <Icons.Close className="w-5 h-5" />
                </button>
              </div>

              {submitted ? (
                <div className="p-6 text-center text-emerald-400 font-bold text-sm">Feedback Recorded!</div>
              ) : (
                <form onSubmit={handleSub} className="space-y-3 text-xs">
                  <p className="text-slate-400">Suggest correct bin for: <strong className="text-white">{scanResult?.result?.name}</strong></p>
                  <select
                    value={selectedBin}
                    onChange={(e) => setSelectedBin(e.target.value)}
                    className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white font-bold"
                  >
                    <option value="RECYCLABLE">Blue Recycling Bin</option>
                    <option value="COMPOST">Green Compost Bin</option>
                    <option value="NON_RECYCLABLE">Gray Landfill Bin</option>
                    <option value="HAZARDOUS">Orange Hazmat Bin</option>
                  </select>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl cursor-pointer">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl cursor-pointer">Submit</button>
                  </div>
                </form>
              )}
            </div>
          </div>
        );
      }

      // Render App into DOM
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
